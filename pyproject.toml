[project]
name = "sanskrit-texts"
version = "0.1.0"
description = "Typed model and Postgres store for the classical Sanskrit text corpus"
readme = "README.md"
# Matches astroacharya's floor+ceiling so the two repos can share one interpreter.
requires-python = ">=3.12,<3.14"

dependencies = [
    "SQLAlchemy>=2.0,<3",
    "pydantic>=2.9,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<6",
    "ruff==0.16.3",
    "mypy>=1.11,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The corpus JSON is NOT packaged — it is the data this reads, not code it ships.
packages = ["sanskrit_texts"]

# --- pytest --------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]

# --- ruff ----------------------------------------------------------------
# Mirrors astroacharya/pyproject.toml so one style covers both repos. The ruff
# version is pinned exactly there for the same reason it is pinned here: a minor
# bump changes formatting and turns an unrelated diff into a whole-file rewrite.
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "scripts/__pycache__"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, B = flake8-bugbear, UP = pyupgrade
select = ["E", "F", "W", "I", "B", "UP"]
# E501 handled by the formatter. B008 is NOT excluded here: this package has no
# FastAPI Depends() idiom, so the exemption astroacharya needs would be dead config.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
# The 23 existing scripts/ are pre-package and are swept separately, not gated by
# this config. Removing this line before they are migrated turns §5 into a lint run.
"scripts/**/*.py" = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- mypy ----------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["sanskrit_texts"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
strict_optional = true
# Unlike astroacharya, this package is being written from scratch, so the
# tightening switches are ON from the start. There is no legacy to sweep.
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
ignore_missing_imports = true
