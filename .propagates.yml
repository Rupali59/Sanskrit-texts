  # Declared 2026-09-16 after the autoplan eng review. Each of these is a coupling the
  # review's findings IMPLY — per rule:adversarial-review-reads-the-ledger §5, a review
  # that ends without new declarations found defects and left the mechanism intact.
  # kind MUST be `code` or `prose`; anything else is a silently deleted edge (G57).
  sanskrit_texts/models.py:
    propagates_to:
      - path: migrations/versions/0001_corpus_schema_and_gate.py
        why: "Two hand-maintained schema definitions with nothing comparing them; a column can have a home in models.py the database does not have"
        kind: code
  tests/test_key_census.py:
    propagates_to:
      - path: sanskrit_texts/models.py
        why: "Each KNOWN_OMITTED entry claims a mechanism makes a key recoverable; verse.status's reason was already false and the test stayed green"
        kind: code
  migrations/versions/0001_corpus_schema_and_gate.py:
    propagates_to:
      - path: tests/test_grants_and_views.py
        why: "the grant-set test asserts corpus_api holds exactly SELECT on the published views, and the grain tests pin published_verse's LEFT JOIN shape; a GRANT or a view change must move these"
        kind: code
      - path: tests/test_publication_gate.py
        why: "The grants and views the gate test asserts are defined in the migration; changing one silently invalidates the other"
        kind: code
  # Declared 2026-09-16 alongside the exporter, promote and the exclusion list. Each is a
  # promise one file makes that another has to keep -- the shape three review phases found
  # independently. kind MUST be `code` or `prose` (G57).
  sanskrit_texts/export.py:
    propagates_to:
      - path: tests/test_roundtrip.py
        why: "export.serialize() IS the serialization contract; after cutover it writes the tracked JSON, so every future git diff depends on indent/ensure_ascii/key order staying put"
        kind: code
      - path: docs/DATABASE.md
        why: "the two export modes and why they cannot be one artifact are documented there; a third mode or a changed default silently makes that section wrong"
        kind: prose
  sanskrit_texts/promote.py:
    propagates_to:
      - path: tests/test_promote.py
        why: "the TRANSITIONS table and the human-only rule are the §6 acceptance criteria; widening either without the test is how `approved` stops meaning a named human reviewed it"
        kind: code
  sanskrit_texts/exclusions.py:
    propagates_to:
      - path: tests/test_key_census.py
        why: "the census skips exactly what the importer skips; if they diverge the census either endorses fabricated files as schema or fails on texts nobody intends to import"
        kind: code
  # Declared 2026-09-16 with the four parallel lanes. The migration's new target is MERGED
  # into its existing key above: re-declaring a source key makes a duplicate YAML mapping key,
  # which PyYAML silently collapses (keeping the last) but propagate rejects outright — and it
  # rejected the WHOLE sidecar, dropping all 25 of this repo's edges while `yaml.safe_load`
  # reported the file as parsing fine. kind MUST be `code` or `prose` (G57).
  tests/conftest.py:
    propagates_to:
      - path: .github/workflows/corpus.yml
        why: "the truncate guard hardcodes EXPECTED_PORT=5433 and requires a `_test` database; CI maps 5433:5432 and creates sanskrit_texts_test to satisfy exactly those — change either rule and CI fails, or worse, gets loosened to pass"
        kind: code
  sanskrit_texts/reader.py:
    propagates_to:
      - path: scripts/check_inventory.py
        why: "check_inventory is the reader's first consumer and depends on its return shape {ch,sh,tr,pct,dir,cat,dupes,titles,authority}; a renamed key breaks the pre-import gate"
        kind: code
      - path: tests/test_reader.py
        why: "the reader must default to CORPUS_API_DSN and never read the owner DSN implicitly; that is the publication gate's precondition and this test is its only guard"
        kind: code
  sanskrit_texts/importer.py:
    propagates_to:
      - path: tests/test_importer_dryrun.py
        why: "the dry-run test isolates `dry_run` as the SOLE guard by passing allow_partial=True; a change to the rollback branches in run() can silently re-introduce the overlap that made 3 of 5 tests unable to attribute their own pass"
        kind: code
