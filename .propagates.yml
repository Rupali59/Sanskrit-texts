# sanskrit-texts propagation sidecar.
#
# The corpus is the PRODUCER of from-canon shloka stores; astroacharya's from-canon
# compute is the CONSUMER — each primitive cites @source(("<Text>", chapter, [shlokas]))
# per astroacharya MASTER_DECISIONS D17.
#
# docs/INVENTORY.md is the hand-maintained manifest (its generator was retired 2026-08-17).
# Update it in the SAME commit as the corpus change; that change fires the drift rows below
# so astroacharya's canon trackers stay in sync with what the corpus can @source. Because
# nothing regenerates it now, it can drift from the tree — its header carries a one-line
# check, and the tree is authoritative when they disagree.
#
# Deliberately NOT declared: individual chapter JSON (too granular — thousands of files,
# would flood the ledger). INVENTORY.md is the single coarse edge: text-level changes only.
#
# Paths are relative to this file. Schema: ~/Documents/GitHub/propagate/propagates.schema.json

sources:
  docs/INVENTORY.md:
    propagates_to:
      - path: ../astroacharya/app/masters/hora_acharya/reference.md
        why: "New/renamed texts change what from-canon primitives can @source; reference.md is the canon tracker"
        kind: prose
      - path: ../astroacharya/app/masters/hora_acharya/DATA_GAPS.md
        why: "A newly-ingested text may close (or open) a canon gap for primitive implementers"
        kind: prose
      # Declared 2026-08-17, after finding both of these carried a stale copy of the
      # corpus path map. Commit 1cccca6 (2026-07-17) recategorised Hora into schools
      # — ~194 renames — and neither consumer followed: 9 of 10 paths in
      # list_sources.py and 11 of 17 rows in CLAUDE.md pointed at directories that no
      # longer existed, for a month, with no drift row because the coupling was never
      # declared. INVENTORY.md is the generated manifest, so it moves on exactly the
      # changes that invalidate these two.
      - path: ../astroacharya/scripts/list_sources.py
        why: "TEXT_ID_TO_PATH restates corpus paths; a recategorisation or rename breaks --missing for every affected text"
        kind: code
      - path: CLAUDE.md
        why: "The text_id registry table. Corrected 2026-08-19 — the old why called it \"the copy
          that rots\", which was true when written and is not now: the table was rewritten to defer
          on paths (\"INVENTORY is the manifest and wins on paths\") and to carry only what INVENTORY
          does not — text_id, shloka counts, translation state. The edge stays because those counts
          are re-derived from the same JSON INVENTORY describes, so a corpus change still has to
          reach both; it is a complement to keep in step, no longer a duplicate to delete."
        kind: prose
    concepts:
      "§Corpus":
        - shloka
        - "@source"
        - from-canon
        - chapter
        - BPHS

  # --- source -> corpus (declared 2026-08-18) -------------------------------
  #
  # The JSON in this repo is DERIVED from the Devanagari transcriptions in
  # ../sanskrit-texts-sources/. Until now nothing declared that, so improving a
  # transcription left the derived text silently stale. One coarse edge per text —
  # the same call the INVENTORY edge above makes, and for the same reason: per-chapter
  # edges would flood the ledger.
  #
  # Declared HERE and not in the sources tree on purpose: ../sanskrit-texts-sources/ is
  # gitignored (workspace .gitignore:39), so a sidecar placed there would be untracked and
  # lost on a fresh clone. Source keys resolve via path.resolve(sidecarDir, key), so `../`
  # works and the declaration lives with the repo it protects.
  #
  # On a clone without the sources these edges cannot resolve. That is correct and
  # attributable — 'the source is not on this machine', not silence.

  ../sanskrit-texts-sources/Hora/Nadi/Bhrigusootram/BhriguSutram.md:
    propagates_to:
      - path: Hora/Nadi/Bhrigusootram/Bhrigusootram.json
        why: "corpus JSON is derived from this transcription; correcting the source leaves the derived text stale"
        kind: prose
